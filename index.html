html[data-design="diary"] .day-h { background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-design="diary"] .banner, html[data-design="diary"] .welcome { border-radius: 6px; }
html[data-design="diary"] .logo { border-radius: 50%; background: #FFE066; color: #2F2A26; font-family: var(--font-display); font-weight: 400; font-size: 21px; box-shadow: 0 0 0 3px #FFFFFF, 0 5px 10px -4px rgba(60, 50, 40, .5); }
html[data-design="diary"] .dock-add { border-radius: 14px; background: var(--accent); color: #FFFFFF; box-shadow: 0 0 0 3px #FFFFFF, 0 8px 16px -8px rgba(40, 55, 160, .7); }
html.dark[data-design="diary"] .dock-add { color: #1E1D24; box-shadow: 0 0 0 3px #2C2B34; }

/* 넓은 화면: 크라프트지 메뉴판 · 스티커 메뉴 */
@media (min-width: 981px) {
  html[data-design="diary"] .hud { --ink: #3B2A17; --ink-2: #4E3920; --ink-3: #6E5536; --line: rgba(90, 60, 25, .25); --hover: rgba(255, 255, 255, .28); --tint: rgba(255, 255, 255, .35); --tint-2: rgba(255, 255, 255, .5); color: var(--ink); border-radius: 18px; }
  html.dark[data-design="diary"] .hud { --ink: #F2E6D6; --ink-2: #D9C8B2; --ink-3: #AE9C86; --line: rgba(255, 230, 200, .16); --hover: rgba(255, 255, 255, .07); --tint: rgba(255, 255, 255, .08); --tint-2: rgba(255, 255, 255, .14); }
  html[data-design="diary"] .brand { margin: 0 2px; padding: 10px 10px 12px; border: 0; border-radius: 10px; background: #FFFFFF; box-shadow: 0 0 0 3px #FFFFFF, 0 5px 12px -6px rgba(80, 55, 25, .6); transform: rotate(-1.5deg); --ink: #2F2A26; --ink-3: #888077; }
  html.dark[data-design="diary"] .brand { background: #2C2B34; box-shadow: 0 5px 12px -6px rgba(0, 0, 0, .7); --ink: #ECE8F0; --ink-3: #96909F; }
  html[data-design="diary"] .hud .dock::before, html[data-design="diary"] .tools::before { font-family: var(--font-display); font-size: 14px; font-weight: 400; color: var(--ink-2); }
  html[data-design="diary"] .hud .dock-btn { border-radius: 12px; font-family: var(--font-display); font-size: 17px; font-weight: 400; }
  html[data-design="diary"] .tools { border-top-style: dashed; }
  html[data-design="diary"] #main > .period-pill { border-radius: 12px; }
  html[data-design="diary"] .side { padding-top: 16px; margin-top: -16px; }
}
@media (max-width: 980px) {
  html[data-design="diary"] .hud .pill { background: #FFFFFF; border: 0; box-shadow: 0 0 0 3px #FFFFFF, 0 6px 14px -8px rgba(60, 50, 40, .5); -webkit-backdrop-filter: none; backdrop-filter: none; }
  html.dark[data-design="diary"] .hud .pill { background: #27262E; box-shadow: 0 6px 14px -8px rgba(0, 0, 0, .7); }
  html[data-design="diary"] .dock { border: 0; border-radius: 16px; background: var(--side-bg); box-shadow: var(--pop-shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
  html[data-design="diary"] .dock-btn { border-radius: 12px; color: #3B2A17; font-family: var(--font-display); font-size: 16px; font-weight: 400; }
  html.dark[data-design="diary"] .dock-btn { color: #F2E6D6; }
  html[data-design="diary"] .dock-btn.is-on { background: #FFFFFF; color: #2F2A26; box-shadow: 0 0 0 2.5px #FFFFFF, 0 4px 10px -4px rgba(80, 55, 25, .6); }
  html.dark[data-design="diary"] .dock-btn.is-on { background: #2C2B34; color: #ECE8F0; box-shadow: none; }
}

/* ============================================================
   6 · 목공방 — 타공판 벽 · 자작나무 합판 카드(옆면에 겹 무늬, 황동 나사) · 호두나무 메뉴판
   나무 블록 버튼 · 새겨 넣은 듯한 제목 · 글꼴 IBM Plex Sans KR + 숫자 Roboto Slab
   ============================================================ */
html[data-design="wood"] {
  /* 숫자·영문은 Roboto Slab(나무 간판 느낌), 한글은 IBM Plex Sans KR */
  --font: "Roboto Slab", "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --bg-page: #E8DCC6;
  --glass: #F8F0E1; --glass-strong: #FBF6EC; --glass-edge: rgba(120, 85, 45, .2);
  --grain: repeating-linear-gradient(0deg, rgba(150, 105, 55, .03) 0 1px, transparent 1px 6px), repeating-linear-gradient(0deg, rgba(150, 105, 55, .028) 0 2px, transparent 2px 23px);
  --glass-shadow: inset 0 1px 0 rgba(255, 255, 255, .7), 0 12px 22px -14px rgba(80, 55, 25, .6), 0 2px 3px rgba(80, 55, 25, .16);
  --pop-shadow: 0 28px 64px -24px rgba(70, 45, 20, .55), 0 4px 12px rgba(70, 45, 20, .12);
  --solid: #FFFBF3; --surface: #F8F0E1; --field: #FFFBF3; --tint: #F0E4CF; --tint-2: #E6D6BA; --hover: rgba(110, 75, 40, .07);
  --ink: #33261A; --ink-2: #5C4834; --ink-3: #8A735B;
  --line: rgba(110, 75, 40, .18); --line-2: rgba(110, 75, 40, .1);
  --accent: #2E6E55; --accent-2: #255C46; --accent-soft: rgba(46, 110, 85, .13); --accent-ink: #FFFFFF;
  --walnut: repeating-linear-gradient(90deg, rgba(0, 0, 0, .07) 0 1.5px, transparent 1.5px 8px), repeating-linear-gradient(90deg, rgba(255, 215, 170, .05) 0 1px, transparent 1px 17px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .06) 0 3px, transparent 3px 43px), linear-gradient(180deg, #74513A, #5A3D2A);
  --brass: radial-gradient(circle at 35% 30%, #F7E2A6, #CFA04B 62%, #9C7330);
  --screw: radial-gradient(circle, #F2D48C 0 1.7px, #C2913E 2.1px 3.7px, rgba(90, 60, 20, .35) 4.1px, transparent 4.7px);
  --exp: #d14742; --inc: #0788b7; --exp-soft: rgba(209, 71, 66, .09); --inc-soft: rgba(7, 136, 183, .09);
  --mute-series: #D2C2A6; --prev-series: #A28E73; --track: #EDE0C8; --grid: #EEE3CF; --axis: #D2BF9F;
  --good: #2E7A45; --bad: #B83A32; --good-soft: rgba(46, 122, 69, .1); --bad-soft: rgba(184, 58, 50, .1);
  --d1: #b53532; --d2: #078cbc; --d3: #077f22; --d4: #7c4bb6; --d5: #ce8703;
  --s1: #078cbc; --s2: #077f22; --s3: #7c4bb6; --s4: #ce8703;
  --h1: #feebe9; --h2: #ffd2cc; --h3: #feb0a8; --h4: #fa887f; --h5: #e9625a; --h6: #cf413d;
  --sat: #1F6E9A; --sun: #B83A32;
  --w-asset: #F6E7C8; --w-exp: #F1D2BF; --w-inc: #D9E3E6; --w-fix: #E9D6AE;
  --side-bg: var(--walnut); --side-edge: rgba(40, 25, 12, .5); --side-shadow: inset 0 1px 0 rgba(255, 220, 180, .14), 0 3px 0 #3E2A1B, 0 20px 34px -20px rgba(50, 30, 10, .75);
  --menu-on: var(--grain), linear-gradient(180deg, #FBF4E6, #EEDFC3); --menu-on-ink: #3A2817; --menu-on-shadow: inset 0 2px 3px rgba(90, 60, 30, .22), 0 1px 0 rgba(255, 220, 180, .2);
  --head-bg: var(--grain), #F8F0E1;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
html.dark[data-design="wood"] {
  --bg-page: #1C1713;
  --glass: #2A221C; --glass-strong: #30271F; --glass-edge: rgba(255, 220, 180, .08);
  --grain: repeating-linear-gradient(0deg, rgba(255, 220, 180, .025) 0 1px, transparent 1px 6px), repeating-linear-gradient(0deg, rgba(255, 220, 180, .02) 0 2px, transparent 2px 23px);
  --glass-shadow: inset 0 1px 0 rgba(255, 220, 180, .05), 0 12px 22px -14px rgba(0, 0, 0, .85);
  --pop-shadow: 0 28px 64px -20px rgba(0, 0, 0, .85);
  --solid: #342A21; --surface: #2A221C; --field: #241D17; --tint: #33291F; --tint-2: #3D3126; --hover: rgba(255, 220, 180, .05);
  --ink: #F1E6D6; --ink-2: #CDBDA6; --ink-3: #A08C74;
  --line: rgba(255, 220, 180, .1); --line-2: rgba(255, 220, 180, .06);
  --accent: #7FC4A2; --accent-2: #98D2B5; --accent-soft: rgba(127, 196, 162, .15); --accent-ink: #1C1713;
  --walnut: repeating-linear-gradient(90deg, rgba(0, 0, 0, .18) 0 1.5px, transparent 1.5px 8px), repeating-linear-gradient(90deg, rgba(255, 215, 170, .03) 0 1px, transparent 1px 17px), linear-gradient(180deg, #3B2A1E, #2C1F15);
  --exp: #df544e; --inc: #0995c8; --exp-soft: rgba(223, 84, 78, .13); --inc-soft: rgba(9, 149, 200, .13);
  --mute-series: #54463A; --prev-series: #8E7D6A; --track: #3A2F25; --grid: #33291F; --axis: #4A3D31;
  --good: #7FD4A0; --bad: #F08B84; --good-soft: rgba(127, 212, 160, .12); --bad-soft: rgba(240, 139, 132, .12);
  --d1: #c2423d; --d2: #067fab; --d3: #1a8c2d; --d4: #8757c3; --d5: #c68102;
  --s1: #067fab; --s2: #1a8c2d; --s3: #8757c3; --s4: #c68102;
  --h1: #502825; --h2: #733430; --h3: #99403b; --h4: #c04c46; --h5: #e06159; --h6: #fb8278;
  --sat: #6FB4DB; --sun: #F08B84;
  --w-asset: #3B3122; --w-exp: #3E2A22; --w-inc: #27323A; --w-fix: #3A3020;
  --side-edge: rgba(0, 0, 0, .5); --side-shadow: 0 20px 34px -20px rgba(0, 0, 0, .9);
  --menu-on: var(--grain), #3A2F25; --menu-on-ink: #F7EAD6; --menu-on-shadow: inset 0 2px 3px rgba(0, 0, 0, .35);
  --head-bg: var(--grain), #2A221C;
}
html[data-design="wood"] .backdrop { background-color: var(--bg-page); background-image: radial-gradient(circle, rgba(255, 255, 255, .55) 0 2.4px, transparent 2.9px), radial-gradient(circle, #B8A27E 0 2.6px, transparent 3.1px); background-size: 28px 28px; background-position: 13px 15px, 14px 14px; }
html.dark[data-design="wood"] .backdrop { background-image: radial-gradient(circle, rgba(0, 0, 0, .55) 0 2.6px, transparent 3.1px), radial-gradient(circle, rgba(255, 220, 180, .06) 0 2.4px, transparent 2.9px); background-position: 14px 14px, 13px 15px; }
html[data-design="wood"] .backdrop i { display: none; }

/* 자작나무 합판 카드: 나뭇결 · 아래 옆면 겹 무늬 · 위쪽 황동 나사 */
html[data-design="wood"] .card { border: 1px solid var(--glass-edge); border-radius: var(--r-lg); background: var(--grain), var(--glass); box-shadow: var(--glass-shadow); padding-bottom: 26px; }
html[data-design="wood"] .card::before { content: ""; position: absolute; left: 7px; right: 7px; top: 7px; height: 10px; background: var(--screw) left center / 10px 10px no-repeat, var(--screw) right center / 10px 10px no-repeat; pointer-events: none; }
html[data-design="wood"] .card::after { content: ""; position: absolute; left: -1px; right: -1px; bottom: -1px; height: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg); background: repeating-linear-gradient(180deg, #D6B985 0 1px, #F2DFBB 1px 2.6px); box-shadow: inset 0 1px 0 rgba(110, 75, 40, .3); pointer-events: none; }
html.dark[data-design="wood"] .card::after { background: repeating-linear-gradient(180deg, #4A3A2A 0 1px, #5E4A35 1px 2.6px); }
html[data-design="wood"] .card-title { font-size: 18px; font-weight: 700; gap: 9px; letter-spacing: -0.01em; color: #4A3220; text-shadow: 0 1px 0 rgba(255, 255, 255, .75); }
html.dark[data-design="wood"] .card-title { color: var(--ink); text-shadow: 0 -1px 0 rgba(0, 0, 0, .6); }
html[data-design="wood"] .card-title .ic { box-sizing: content-box; width: 15px; height: 15px; padding: 6px; border-radius: 50%; color: #4A3015; background: var(--brass); box-shadow: inset 0 -1px 2px rgba(0, 0, 0, .25), 0 1px 2px rgba(0, 0, 0, .22); }
html[data-design="wood"] :is(.hero, .big, .fig, .fl-v, .wk-v, .dn-center b, .st-v) { font-weight: 700; letter-spacing: -0.03em; }
html[data-design="wood"] .hero { font-size: 50px; color: #3E2A17; text-shadow: 0 1px 0 rgba(255, 255, 255, .65); }
html.dark[data-design="wood"] .hero { color: var(--ink); text-shadow: none; }
/* 요약 = 나무 종류가 다른 판 (단풍 · 벚나무 · 물푸레(칠) · 참나무) + 황동 이름표 */
html[data-design="wood"] .kpi-asset { background: var(--grain), var(--w-asset); --surface: var(--w-asset); }
html[data-design="wood"] .kpi-exp { background: var(--grain), var(--w-exp); --surface: var(--w-exp); }
html[data-design="wood"] .kpi-inc { background: var(--grain), var(--w-inc); --surface: var(--w-inc); }
html[data-design="wood"] .kpi-fix { background: var(--grain), var(--w-fix); --surface: var(--w-fix); }
html[data-design="wood"] .kpis .tag { height: 27px; padding: 0 11px; border-radius: 5px; background: linear-gradient(180deg, #F1D78F, #C99D49); color: #3B2A10; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 1px 2px rgba(60, 40, 10, .35); }
html[data-design="wood"] .kpis .tag .dot { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .7); }
html[data-design="wood"] .kpis .meter { background: rgba(110, 75, 40, .15); box-shadow: inset 0 1px 2px rgba(80, 55, 25, .25); }
html[data-design="wood"] .kpis .meter i { background: var(--accent); }
html[data-design="wood"] .fx-mini .dd { background: rgba(255, 251, 243, .75); }
html.dark[data-design="wood"] .fx-mini .dd { background: rgba(255, 220, 180, .08); }

/* 입력 · 칩 · 버튼: 파낸 홈 · 나무 블록 */
html[data-design="wood"] .input { border: 1px solid rgba(110, 75, 40, .25); border-radius: 8px; background: var(--field); box-shadow: inset 0 2px 3px rgba(90, 60, 30, .12); }
html[data-design="wood"] .input:focus { border-color: var(--accent); box-shadow: inset 0 2px 3px rgba(90, 60, 30, .12), 0 0 0 3px var(--accent-soft); }
html.dark[data-design="wood"] .input { border-color: rgba(255, 220, 180, .14); box-shadow: inset 0 2px 3px rgba(0, 0, 0, .35); }
html[data-design="wood"] .chip, html[data-design="wood"] .tbl-btn, html[data-design="wood"] .more-btn { border-radius: 8px; background: linear-gradient(180deg, #FBF4E7, #EFE1C8); color: var(--ink-2); box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 0 rgba(140, 100, 55, .4); }
html.dark[data-design="wood"] :is(.chip, .tbl-btn, .more-btn) { background: linear-gradient(180deg, #3D3127, #33291F); box-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
html[data-design="wood"] .chip:active, html[data-design="wood"] .cat-chip:active { transform: translateY(1px); }
html[data-design="wood"] .chip.is-on, html[data-design="wood"] .tbl-btn.is-on { background: linear-gradient(180deg, #E1EFE6, #CBE2D4); color: #1F4A39; box-shadow: inset 0 0 0 1.5px var(--accent), 0 2px 0 rgba(46, 110, 85, .45); }
html.dark[data-design="wood"] .chip.is-on, html.dark[data-design="wood"] .tbl-btn.is-on { background: #2C4337; color: #CDEBDB; }
html[data-design="wood"] .cat-chip { border-radius: 10px; background: var(--grain), linear-gradient(180deg, #FCF6EA, #F0E3CB); box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 0 rgba(140, 100, 55, .38); }
html.dark[data-design="wood"] .cat-chip { background: var(--grain), #342A21; box-shadow: 0 3px 0 rgba(0, 0, 0, .45); }
html[data-design="wood"] .cat-chip.is-on { background: linear-gradient(180deg, #E3F0E8, #CDE3D6); color: var(--ink); box-shadow: inset 0 0 0 2px var(--accent), 0 3px 0 rgba(46, 110, 85, .5); }
html.dark[data-design="wood"] .cat-chip.is-on { background: #2C4337; }
html[data-design="wood"] .btn { border-radius: 10px; }
html[data-design="wood"] .btn-primary { background: linear-gradient(180deg, #7A5538, #5E412B); color: #F8EBD8; box-shadow: inset 0 1px 0 rgba(255, 220, 180, .22), 0 3px 0 #3E2A1B, 0 9px 16px -8px rgba(60, 40, 20, .7); }
html[data-design="wood"] .btn-primary:hover:not(:disabled) { background: linear-gradient(180deg, #6E4C32, #533926); }
html[data-design="wood"] .btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255, 220, 180, .2), 0 1px 0 #3E2A1B; }
html.dark[data-design="wood"] .btn-primary { background: linear-gradient(180deg, #C9A46A, #A7834E); color: #241A10; box-shadow: 0 3px 0 #6E5330; }
html[data-design="wood"] .btn-block { height: 52px; margin-top: 18px; font-size: 16.5px; }
html[data-design="wood"] .seg { padding: 4px; border-radius: 11px; background: #E3D1B1; box-shadow: inset 0 1px 3px rgba(80, 55, 25, .25); }
html.dark[data-design="wood"] .seg { background: #241D17; }
html[data-design="wood"] .seg button { border-radius: 8px; }
html[data-design="wood"] .seg button.is-on { background: linear-gradient(180deg, #FFFBF3, #F1E4CC); color: var(--ink); box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 0 rgba(140, 100, 55, .45); }
html.dark[data-design="wood"] .seg button.is-on { background: #3D3127; color: var(--ink); box-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
html[data-design="wood"] .switch input:checked + .sw { background: var(--accent); }
html[data-design="wood"] .emo { border-radius: 10px; background: var(--grain), #FBF4E7; box-shadow: inset 0 1px 0 #FFFFFF, 0 2px 0 rgba(140, 100, 55, .3); }
html.dark[data-design="wood"] .emo { background: #342A21; box-shadow: none; }
html[data-design="wood"] :is(.rk, .dn-row, .ent) { border-radius: 10px; }
html[data-design="wood"] :is(.ps, .fl-st, .wk-sub, .day-detail, .cmp-block, .ms, .st, .note, .empty.sm, .ipo-st, .ipo-item) { border: 0; border-radius: 10px; background: var(--grain), var(--tint); box-shadow: inset 0 1px 2px rgba(80, 55, 25, .12); }
html.dark[data-design="wood"] :is(.ps, .fl-st, .wk-sub, .day-detail, .cmp-block, .ms, .st, .note, .ipo-st, .ipo-item) { box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35); }
html[data-design="wood"] .fl-st.st-exp { background: var(--grain), var(--w-exp); }
html[data-design="wood"] .fl-st.st-inc { background: var(--grain), var(--w-inc); }
html[data-design="wood"] .ipo-st.acc { background: var(--grain), var(--w-asset); }
html[data-design="wood"] .ps::before { width: 5px; top: 12px; bottom: 12px; border-radius: 0 3px 3px 0; }
html[data-design="wood"] .ps-y { --ps-c: #2E6E55; }
html[data-design="wood"] .ps-m { --ps-c: #8F6A1A; }
html[data-design="wood"] .ps-w { --ps-c: #6B4A33; }
html.dark[data-design="wood"] .ps-y { --ps-c: #7FC4A2; }
html.dark[data-design="wood"] .ps-m { --ps-c: #E0B85E; }
html.dark[data-design="wood"] .ps-w { --ps-c: #C9A27F; }
html[data-design="wood"] .ps-badge { border-radius: 4px; }
html[data-design="wood"] .cal-dows, html[data-design="wood"] .cal-grid { gap: 5px; }
html[data-design="wood"] .cal-cell { border-radius: 7px; background: var(--grain), var(--tint); box-shadow: 0 2px 0 rgba(140, 100, 55, .28); }
html.dark[data-design="wood"] .cal-cell { box-shadow: 0 2px 0 rgba(0, 0, 0, .45); }
html[data-design="wood"] .cal-cell[class*=" h"] { background-image: var(--grain); }
html[data-design="wood"] .cal-cell.blank { background: transparent; box-shadow: none; }
html[data-design="wood"] .cal-cell:hover { transform: translateY(-1px); }
html[data-design="wood"] .cal-cell.sel { box-shadow: 0 0 0 2.5px var(--accent), 0 2px 0 rgba(46, 110, 85, .5); }
html[data-design="wood"] .cal-cell.today .cal-d { background: var(--brass); color: #3B2A10 !important; }
html[data-design="wood"] .mm-c { border-radius: 2px; }

/* 떠 있는 것들 */
html[data-design="wood"] .modal { border: 0; border-radius: 18px; background: var(--grain), var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-design="wood"] .menu, html[data-design="wood"] .tt { border: 1px solid var(--glass-edge); border-radius: 12px; background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-design="wood"] .toast { border-radius: 12px; background: #4A3220; color: #F8EBD8; }
html.dark[data-design="wood"] .toast { background: #F1E6D6; color: #1C1713; }
html[data-design="wood"] .modal-bg { background: rgba(50, 32, 15, .3); }
html[data-design="wood"] .tbl-wrap { border-radius: 10px; }
html[data-design="wood"] .day-h { background: var(--glass-strong); -webkit-backdrop-filter: none; backdrop-filter: none; }
html[data-design="wood"] .banner, html[data-design="wood"] .welcome { border-radius: 16px; background: var(--grain), var(--glass); }
html[data-design="wood"] .logo { border-radius: 50%; background: var(--brass); color: #3B2A10; box-shadow: inset 0 -2px 3px rgba(0, 0, 0, .25), inset 0 2px 2px rgba(255, 255, 255, .5), 0 2px 4px rgba(0, 0, 0, .3); }
html[data-design="wood"] .dock-add { border-radius: 10px; background: linear-gradient(180deg, #7A5538, #5E412B); color: #F8EBD8; box-shadow: 0 3px 0 #3E2A1B; }
html.dark[data-design="wood"] .dock-add { background: linear-gradient(180deg, #C9A46A, #A7834E); color: #241A10; box-shadow: 0 3px 0 #6E5330; }

/* 넓은 화면: 호두나무 메뉴판 (밝은 글씨 · 네 귀퉁이 나사) */
@media (min-width: 981px) {

  html[data-design="wood"] .hud::before { content: ""; position: absolute; inset: 9px; pointer-events: none; background: var(--screw) left top / 10px 10px no-repeat, var(--screw) right top / 10px 10px no-repeat, var(--screw) left bottom / 10px 10px no-repeat, var(--screw) right bottom / 10px 10px no-repeat; }
  html[data-design="wood"] .brand { margin-top: 4px; }

  html.dark[data-design="wood"] .hud .dock-btn.is-on { text-shadow: none; }
  html[data-design="wood"] .hud .switch input:checked + .sw { background: #D4A94C; }
  html[data-design="wood"] .tools .tool-btn, html[data-design="wood"] .tools .icon-btn, html[data-design="wood"] .switch { border-radius: 10px; }
  html[data-design="wood"] #main > .period-pill { border-radius: 14px; }
}
@media (max-width: 980px) {
  html[data-design="wood"] .hud .pill { background: var(--grain), var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
  html[data-design="wood"] .dock { border: 0; border-radius: 16px; background: var(--walnut); box-shadow: 0 3px 0 #3E2A1B, var(--pop-shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
  html[data-design="wood"] .dock-btn { border-radius: 10px; color: #F7EAD6; }

  html[data-design="wood"] .dock-btn.is-on { background: var(--menu-on); color: var(--menu-on-ink); box-shadow: var(--menu-on-shadow); }
  html[data-design="wood"] .dock-add { background: var(--brass); color: #3B2A10; box-shadow: 0 2px 0 #7A5A22; }
}

/* ============================================================
   공모주 손익 페이지 (모든 시안 공통 · 색은 시안의 토큰을 따라감)
   손익 색: 한국 증권 앱처럼 이익은 빨강(▲) 계열, 손실은 파랑(▼) 계열 — 부호(+/−)를 늘 같이 표시
   ============================================================ */
.pl-up { color: var(--up); }
.pl-down { color: var(--down); }
.bg-up { background: var(--up); }
.bg-down { background: var(--down); }
.kpi-line-btn { width: 100%; text-align: left; border-radius: 8px; margin: 0 -6px; padding: 2px 6px; width: calc(100% + 12px); }
.kpi-line-btn:hover { background: var(--hover); }
.kpi-line-btn span:first-child { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }

.ipo-head .card-sub b { color: var(--ink-2); }
.ipo-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.ipo-st { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding: 14px 16px 13px; border-radius: var(--r-md); background: var(--tint); }
.ipo-st.acc { background: var(--accent-soft); }
.ipo-st-l { display: flex; align-items: baseline; gap: 6px; font-size: 13.5px; font-weight: 800; color: var(--ink-2); white-space: nowrap; }
.ipo-st-l small { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.ipo-st b { font-family: var(--font-num); font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; white-space: nowrap; }
.ipo-st-s { font-size: 12.5px; font-weight: 700; line-height: 1.45; color: var(--ink-3); }
#ipoHead.w-md .ipo-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
#ipoHead.w-xs .ipo-st b { font-size: 20px; }

/* 입력 폼: 종목명·메모 → ① 청약 ② 환불 ③ 매도 → 수수료 · 계산식 → 기록하기 */
.ipo-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-areas: "name name memo memo" "steps steps steps steps" "fs ft prev prev" "submit submit submit submit"; gap: 12px 14px; align-items: end; }
.ipo-form .lbl { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 6px 6px; }
.ipo-form .lbl > .input, .ipo-form .lbl > .ipo-amt { grid-column: 1 / -1; }
.lbl-sub { font-size: 12px; font-weight: 700; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ip-name { grid-area: name; } .ip-memo { grid-area: memo; } .ip-steps { grid-area: steps; } .ip-fs { grid-area: fs; } .ip-ft { grid-area: ft; } .ip-prev { grid-area: prev; } .ip-submit { grid-area: submit; }
.ipo-amt { position: relative; display: block; }
.ipo-amt .input { padding-right: 34px; text-align: right; font-weight: 800; font-family: var(--font-num); }
.ipo-amt > span { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); font-size: 14px; font-weight: 800; color: var(--ink-3); pointer-events: none; }
.ip-submit { height: 44px; }
.ipo-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.ipo-step { display: flex; flex-direction: column; gap: 10px; min-width: 0; padding: 12px 13px 13px; border-radius: var(--r-md); background: var(--tint); }
.ipo-step-h { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 14.5px; font-weight: 800; color: var(--ink); }
.ipo-step-h i { display: inline-grid; place-items: center; width: 21px; height: 21px; flex-shrink: 0; border-radius: 50%; background: var(--ink); color: var(--bg-page); font-style: normal; font-size: 12px; font-weight: 800; font-family: var(--font-num); }
.ipo-step-h span { margin-left: auto; font-size: 12px; font-weight: 800; color: var(--ink-3); white-space: nowrap; }
.ipo-step .ref-chip { align-self: flex-start; }
.ipo-calc { align-self: center; display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.55; color: var(--ink-2); }
.ipo-calc b { font-family: var(--font-num); font-weight: 800; color: var(--ink); }
.ipo-calc b.pl-up { color: var(--up); } .ipo-calc b.pl-down { color: var(--down); }
.ipo-calc small { font-size: 12px; font-weight: 700; color: var(--ink-3); }
/* 760px 아래: 종목명·메모, 수수료 두 칸씩 · 세 단계는 그대로 나란히 */
#ipoFormCard.w-md .ipo-form { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "name memo" "steps steps" "fs ft" "prev prev" "submit submit"; }
/* 640px 아래: 세 단계를 위아래로 (단계 안은 날짜 | 금액) */
#ipoFormCard.w-sm .ipo-steps { grid-template-columns: minmax(0, 1fr); }
#ipoFormCard.w-sm .ipo-step { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }
#ipoFormCard.w-sm .ipo-step-h, #ipoFormCard.w-sm .ipo-step .ref-chip { grid-column: 1 / -1; justify-self: start; }
#ipoFormCard.w-xs .ipo-form { grid-template-columns: minmax(0, 1fr); grid-template-areas: "name" "memo" "steps" "fs" "ft" "prev" "submit"; }
/* 단계 칸이 좁을 때 보조 설명은 줄여요 */
.ipo-step .lbl-sub { font-size: 11.5px; }
#ipoFormCard.w-xs .ipo-step { grid-template-columns: minmax(0, 1fr); }

/* 반영 칩 (폼의 체크박스 · 목록의 버튼 같은 모양) */
.ref-chip { position: relative; display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px 0 10px; border-radius: 999px; font-size: 13.5px; font-weight: 800; color: var(--ink-2); background: var(--solid); box-shadow: inset 0 0 0 1.5px var(--line); cursor: pointer; white-space: nowrap; user-select: none; font-family: var(--font); transition: background .15s, box-shadow .15s, color .15s; }
.ref-chip input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.ref-chip .ck { position: relative; display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1.8px var(--ink-3); }
.ref-chip.is-on, .ref-chip:has(input:checked) { color: var(--ink); background: var(--accent-soft); box-shadow: inset 0 0 0 1.8px var(--accent); }
.ref-chip.is-on .ck, .ref-chip:has(input:checked) .ck { background: var(--accent); box-shadow: none; }
.ref-chip.is-on .ck::after, .ref-chip:has(input:checked) .ck::after { content: ""; width: 4px; height: 8px; margin-top: -2px; border: solid var(--accent-ink); border-width: 0 2.2px 2.2px 0; transform: rotate(45deg); }
.ref-chip:hover:not(:disabled) { color: var(--ink); }
.ref-chip:disabled, .ref-chip:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.ref-chip:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 목록 */
.ipo-list { display: flex; flex-direction: column; gap: 10px; }
.ipo-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; padding: 14px 16px 12px; border-radius: var(--r-md); background: var(--tint); }
.ipo-item.is-edit { box-shadow: inset 0 0 0 2px var(--accent); }
.ipo-nm { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 16.5px; font-weight: 800; }
.ipo-nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
.ipo-pl { text-align: right; font-family: var(--font-num); font-size: 17.5px; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.ipo-pl small { display: block; font-size: 12.5px; font-weight: 800; }
.ipo-meta { grid-column: 1 / -1; font-size: 13px; font-weight: 700; line-height: 1.5; color: var(--ink-3); }
.ipo-barw { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; }
.ipo-barw i { display: block; height: 100%; border-radius: 99px; }
.ipo-bot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 4px; }
.ipo-ref { display: flex; flex-wrap: wrap; gap: 6px; }
.ipo-ref .ref-chip { height: 32px; font-size: 13px; }
.ipo-net { display: flex; flex-direction: column; margin-left: auto; font-size: 13px; font-weight: 800; color: var(--ink-3); text-align: right; }
.ipo-net b { font-size: 14px; color: var(--ink); font-family: var(--font-num); }
.ipo-net b.pl-up { color: var(--up); } .ipo-net b.pl-down { color: var(--down); }
.ipo-net small { font-size: 11.5px; font-weight: 700; color: var(--warn); }
.ipo-net small.fut { color: var(--ink-3); }
.ipo-acts { display: flex; gap: 2px; }
@media (max-width: 640px) {
  .ipo-net { margin-left: 0; text-align: left; flex: 1 1 auto; }
  .ipo-item { padding: 13px 14px 11px; }
}

/* ---------- 시안 공통 보정 ---------- */
.kpi-top { flex-wrap: wrap; row-gap: 4px; }
@media (max-width: 640px) {
  .hero, html[data-design] .hero { font-size: 42px; }
  html[data-design] .big { font-size: 28px; }
}

/* GitHub 동기화 창: 바깥 링크 · 저장소 정보 */
.steps a, .note a, .gh-meta a { color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
.gh-meta { margin-top: 10px; font-size: 13px; font-weight: 700; line-height: 1.7; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<header class="hud" id="hud">
  <div class="pill glass blur brand">
    <div class="logo" aria-hidden="true">₩</div>
    <div>
      <div class="brand-name">가계부</div>
      <span class="brand-sub" id="brandSub">내 돈 흐름 한눈에</span>
    </div>
  </div>

  <div class="pill glass blur period-pill">
    <div class="seg" id="periodSeg" role="group" aria-label="기간 단위">
      <button type="button" data-act="period" data-v="year">연간</button>
      <button type="button" data-act="period" data-v="month">월간</button>
      <button type="button" data-act="period" data-v="week">주간</button>
    </div>
    <div class="nav">
      <button type="button" class="icon-btn" data-act="prev" aria-label="이전 기간" data-icon="chevL"></button>
      <button type="button" class="period-label" data-act="pick" id="periodLabel" aria-label="기간 선택"></button>
      <button type="button" class="icon-btn" data-act="next" aria-label="다음 기간" data-icon="chevR"></button>

    </div>
  </div>

  <div class="pill glass blur tools">
    <label class="switch" title="적금·주식처럼 돈을 옮기는 재테크 내역도 지출/수입 통계에 포함해요">
      <input type="checkbox" id="invToggle" />
      <span class="sw" aria-hidden="true"></span>
      <span class="sw-l">재테크 포함</span>
    </label>
    <span class="tool-sep" aria-hidden="true"></span>
    <button type="button" class="tool-btn" data-act="fixed" title="고정지출 관리"><span class="ic-t" data-icon="pin"></span><span class="lbl-t">고정지출</span></button>
    <button type="button" class="tool-btn" data-act="excelMenu" title="엑셀 불러오기·내보내기"><span class="ic-t" data-icon="sheet"></span><span class="lbl-t">엑셀</span></button>
    <button type="button" class="tool-btn" data-act="design" title="디자인 시안 바꾸기"><span class="ic-t" data-icon="palette"></span><span class="lbl-t">디자인</span></button>
    <button type="button" class="icon-btn" data-act="settings" aria-label="설정" title="카테고리·자산·데이터 설정"><span data-icon="gear"></span><span class="lbl-x">설정</span></button>
    <button type="button" class="icon-btn" data-act="cloud" aria-label="GitHub 동기화" title="GitHub 동기화" id="cloudBtn"><span data-icon="cloud"></span><span class="cloud-dot" id="cloudDot" data-s="off"></span><span class="lbl-x">동기화</span></button>
    <button type="button" class="icon-btn" data-act="dark" aria-label="다크 모드 전환" title="다크 모드" id="darkBtn"></button>
  </div>
</header>


<div class="layout">
  <main class="main" id="main">
    <div id="banner"></div>

    <section class="view" id="viewDash" aria-label="대시보드">
      <div class="kpis" id="kpis"></div>
      <div class="row" id="rowA">
        <section class="card" id="cumCard" aria-label="이번 달 소비 추이"></section>
        <section class="card" id="donutCard" aria-label="카테고리별 지출"></section>
      </div>
      <section class="card" id="flowCard" aria-label="지출의 흐름"></section>
      <div class="row" id="rowB">
        <section class="card" id="weekCard" aria-label="최근 일주일"></section>
        <section class="card" id="sumCard" aria-label="기간별 수입과 지출"></section>
      </div>
      <section class="card" id="calCard" aria-label="소비 달력"></section>
    </section>

    <section class="view" id="viewList" aria-label="내역" hidden>
      <div class="card" id="listCard"></div>
    </section>

    <section class="view" id="viewIpo" aria-label="공모주 손익" hidden>
      <section class="card ipo-head" id="ipoHead">
        <div class="card-head"><div><h2 class="card-title"><span data-icon="coins"></span>공모주 손익</h2>
          <p class="card-sub">종목마다 청약 입금액 · 환불 금액 · 매도 금액 · 수수료를 적으면 손익을 계산해요. <b>출금 · 환불 입금 · 매도 입금</b> 중 고른 것만 각자의 날짜에 내 자산에 반영되고, 종목마다 합계 한 줄로 보여요.</p></div></div>
        <div class="ipo-stats" id="ipoStats"></div>
      </section>

      <section class="card ipo-form-card" id="ipoFormCard" aria-labelledby="ipFormTitle">
        <div class="card-head"><div><h3 class="card-title" id="ipFormTitle">새 공모주 기록</h3><p class="card-sub">청약만 했으면 ①만 적고, 환불 · 매도가 끝날 때마다 수정해서 채워요</p></div>
          <div class="card-tools"><button type="button" class="btn btn-sm btn-ghost" id="ipCancel" hidden>수정 취소</button></div></div>
        <form id="ipoForm" class="ipo-form" autocomplete="off" novalidate>
          <label class="lbl ip-name">종목명<input id="ipName" class="input" placeholder="예: 가나다전자" maxlength="40" /></label>
          <label class="lbl ip-memo">메모 <span class="lbl-sub">선택</span><input id="ipMemo" class="input" placeholder="증권사, 배정 수량 등" maxlength="60" /></label>
          <div class="ipo-steps ip-steps">
            <div class="ipo-step" role="group" aria-labelledby="ipS1">
              <div class="ipo-step-h" id="ipS1"><i aria-hidden="true">1</i>청약<span>계좌에서 나간 돈</span></div>
              <label class="lbl">청약일<input type="date" id="ipSd" class="input" /></label>
              <label class="lbl">청약 입금액 <span class="lbl-sub">청약하려고 넣은 돈</span><span class="ipo-amt"><input id="ipSa" class="input" inputmode="numeric" placeholder="0" /><span>원</span></span></label>
              <label class="ref-chip"><input type="checkbox" id="ipRo" /><i class="ck" aria-hidden="true"></i>출금 반영</label>
            </div>
            <div class="ipo-step" role="group" aria-labelledby="ipS2">
              <div class="ipo-step-h" id="ipS2"><i aria-hidden="true">2</i>환불<span>1차 입금</span></div>
              <label class="lbl">환불일<input type="date" id="ipRd" class="input" /></label>
              <label class="lbl">환불 금액 <span class="lbl-sub">배정 후 돌려받은 돈</span><span class="ipo-amt"><input id="ipRa" class="input" inputmode="numeric" placeholder="아직이면 비워 두기" /><span>원</span></span></label>
              <label class="ref-chip"><input type="checkbox" id="ipRr" /><i class="ck" aria-hidden="true"></i>입금 반영</label>
            </div>
            <div class="ipo-step" role="group" aria-labelledby="ipS3">

              <label class="lbl">매도 금액 <span class="lbl-sub">팔고 들어온 돈</span><span class="ipo-amt"><input id="ipXa" class="input" inputmode="numeric" placeholder="아직이면 비워 두기" /><span>원</span></span></label>
              <label class="ref-chip"><input type="checkbox" id="ipRi" /><i class="ck" aria-hidden="true"></i>입금 반영</label>
            </div>
          </div>
          <label class="lbl ip-fs">청약 수수료<span class="ipo-amt"><input id="ipFs" class="input" inputmode="numeric" placeholder="0" /><span>원</span></span></label>

/** 데이터가 바뀐 뒤 공통 처리: 저장 → 인덱스 갱신 → 동기화 예약 → 다시 그리기 */

/* ---------- 인덱스 ---------- */
let IDX = null, DATA_VER = 0;

}
const cat = (id) => idx().catMap.get(id) || { id, name: "미분류", emoji: "🏷️", type: "exp" };
const isInv = (e) => cat(e.c).type === "inv";
const counted = (e) => DB.settings.includeInvest || !isInv(e);
function rangeEntries(from, to) {

}
/** 기간 합계: 금액 +는 지출, -는 수입 (재테크 분야는 설정에 따라 제외) */

/* ---------- 자산 ---------- */
/** 그날까지의 자산 = 기초자산 − 내역 합계 (+ 공모주에서 출금·입금을 고른 만큼) */

  if (withIpo) for (const f of idx().ipoFlows) { if (f.d > dateStr) break; if (f.d >= s.baseDate) v += f.a; }
  return v;
}

/* ---------- 공모주 ---------- */
/* p = { id, n 종목명,
         sd 청약일 · sa 청약 입금액(청약하려고 넣은 돈) · ro 출금 반영,
         rd 환불일 · ra 환불 금액(null = 아직) · rr 1차 입금(환불) 반영,
         xd 매도일 · xa 매도 금액(null = 아직) · ri 2차 입금(매도) 반영,
         fs 청약 수수료 · ft 계좌 간 이체 수수료 · m 메모, t, del } */

/** 배정 금액(주식에 들어간 돈) = 청약 입금액 − 환불 금액 */
const ipoCost = (p) => Math.max(0, p.sa - (p.ra || 0));
/** 손익 = 환불 금액 + 매도 금액 − 청약 입금액 − 청약 수수료 − 이체 수수료 (매도 전이면 null) */

/** 종목 하나: 오늘 내 자산에 반영된 합계(v) · 날짜가 아직 안 온 흐름(fut) · 기초자산 기준일 이전이라 빠진 흐름(early) */

/* ---------- 기간 ---------- */

/* ---------- 고정지출 ---------- */
const ymOf = (s) => s.slice(0, 7);

/* ---------- 내역 생성 ---------- */
let ORD = 0;
function nextOrder() { const n = Date.now() * 10; ORD = Math.max(ORD + 1, n); return ORD; }
function newEntry(p) {

}

function deleteEntry(id, withUndo = true) {

  e.del = 1; e.t = Date.now(); commit();

/* ---------- 분야 자동 추천 ---------- */
let KW = null;
function buildKW() {
  const exact = new Map();
  for (const e of DB.entries) {
    if (e.del || e.src === "sample") continue;
    const k = norm(e.m); if (!k) continue;
    let m = exact.get(k); if (!m) exact.set(k, (m = new Map()));
    m.set(e.c, (m.get(e.c) || 0) + 1);
  }
  KW = exact;

const topOf = (m) => { let best = null, bv = -1; for (const [k, v] of m) if (v > bv) { best = k; bv = v; } return best; };

  const k = norm(memo); if (!k) return null;

  const valid = (id) => id != null && idx().catMap.has(id);
  const ex = KW.get(k); if (ex && valid(topOf(ex))) return topOf(ex);
  if (k.length >= 2) {
    let best = null, bl = 0, bc = 0;
    for (const [key, m] of KW) {
      if (key.length < 2) continue;
      if (key.startsWith(k) || k.includes(key)) {
        const c = topOf(m), cnt = m.get(c), l = Math.min(key.length, k.length);
        if (valid(c) && (l > bl || (l === bl && cnt > bc))) { best = c; bl = l; bc = cnt; }

  }
  let sb = null, sl = 0;
  for (const [id, words] of Object.entries(SEED_KW)) for (const w of words) { const nw = norm(w); if (nw.length > sl && k.includes(nw) && valid(Number(id))) { sb = Number(id); sl = nw.length; } }

/* ---------- 토스트 ---------- */
function toast(msg, opt = {}) {
  const wrap = $("#toasts"); if (!wrap) return;
  const el = document.createElement("div");
  el.className = "toast" + (opt.err ? " err" : "");
  const sp = document.createElement("span"); sp.textContent = msg; el.appendChild(sp);
  let timer;
  const close = () => { clearTimeout(timer); el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); };
  if (opt.action) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = opt.action;
    b.onclick = () => { close(); opt.onAction && opt.onAction(); };
    el.appendChild(b);
  }
  wrap.appendChild(el);
  while (wrap.children.length > 3) wrap.firstChild.remove();
  timer = setTimeout(close, opt.ms || (opt.action ? 6000 : 3200));
}

/* ===== 40-charts.js ===== */
/* ============================================================
   charts: SVG 막대 · 선 · 도넛 · 스파크라인 + 공용 툴팁
   - 막대 ≤ 26px, 데이터 끝만 둥글게, 기준선은 각지게
   - 선 2px(지난 기간은 점선), 점 r4 + 표면색 링, 격자 1px 실선
   - 값 라벨은 겹치지 않는 것만 표시 (큰 값 우선)

    const w = el.offsetWidth, h = el.offsetHeight, vw = innerWidth, vh = innerHeight;

    TT.show(`<div class="tt-t">${esc(it.label)}</div>${ttRow(won(it.value), `${Math.round((it.value / total) * 100)}%`, it.color)}`, ev.clientX, ev.clientY);
  });
  svg.addEventListener("pointerleave", () => { $$(".dn-seg", svg).forEach((s) => s.classList.remove("dim")); setC(top); TT.hide(); });
  svg.addEventListener("click", (ev) => { const seg = ev.target.closest(".dn-seg"); if (seg && opt.onClick) { TT.hide(); opt.onClick(items[Number(seg.dataset.i)]); } });
}

/** 작은 추이선 (자산 등) */
function sparkline(host, values, opt = {}) {
  mount(host, (W) => {
    const H = opt.height || 64, pts = values.map((v, i) => ({ v, i })).filter((p) => p.v != null);
    if (pts.length < 2) { host.innerHTML = ""; return; }
    const vs = pts.map((p) => p.v), mn = Math.min(...vs), mx = Math.max(...vs), span = mx - mn || 1;
    const n = values.length, px = 6, py = 8;
    const x = (i) => px + ((W - px * 2) * i) / (n - 1), y = (v) => py + (1 - (v - mn) / span) * (H - py * 2);
    const d = pts.map((p, k) => `${k ? "L" : "M"}${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    const last = pts[pts.length - 1];
    const area = d + `L${x(last.i).toFixed(1)},${H}L${x(pts[0].i).toFixed(1)},${H}Z`;
    const col = opt.color || "var(--accent)";
    host.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria || "추이")}"><path d="${area}" fill="${col}" fill-opacity=".1"/><path class="c-line" d="${d}" stroke="${col}"/><circle class="c-dot" cx="${x(last.i)}" cy="${y(last.v)}" r="4" fill="${col}"/><rect class="c-hit" x="0" y="0" width="${W}" height="${H}"/></svg>`;
    const svg = host.firstChild;
    svg.addEventListener("pointermove", (ev) => {
      const rect = svg.getBoundingClientRect(); const i = clamp(Math.round(((ev.clientX - rect.left - px) / (W - px * 2)) * (n - 1)), 0, n - 1);
      const v = values[i]; if (v == null) { TT.hide(); return; }
      TT.show(`<div class="tt-t">${esc(opt.labels ? opt.labels[i] : i + 1)}</div>${ttRow(won(v), opt.name || "", col)}`, ev.clientX, ev.clientY);
    });
    svg.addEventListener("pointerleave", () => TT.hide());
  });
}

/* ---------- 공용 ---------- */
function deltaHTML(cur, prev, opts = {}) {
  if (!prev && !cur) return `<span class="delta flat">변화 없음</span>`;
  if (!prev) return `<span class="delta flat">비교할 ${esc(opts.prevName || "이전 기록")}이 없어요</span>`;
  const d = cur - prev, p = Math.round((d / prev) * 1000) / 10;
  if (d === 0) return `<span class="delta flat">— ${esc(opts.prevName || "")}와 같아요</span>`;
  const up = d > 0;
  return `<span class="delta ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${fmt(Math.abs(d))}원 ${opts.words ? (up ? "증가" : "감소") + " " : ""}(${up ? "+" : "−"}${Math.abs(p)}%)</span>`;
}

/* ---------- 이번 달 소비 추이 (지난달 같은 기간과 누적 비교) ---------- */
function renderCum() {
  const el = $("#cumCard"), R = refDate(), [y, m, d] = splitD(R), t = todayStr();
  const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y, nP = dim(py, pm);
  const dT = dailyMap(ymd(y, m, 1), R), dP = dailyMap(ymd(py, pm, 1), ymd(py, pm, nP));
  const cur = [], prev = []; let ct = 0, cp = 0, pAll = 0;
  for (let i = 1; i <= nP; i++) pAll += (dP.get(ymd(py, pm, i)) || { exp: 0 }).exp;
  for (let i = 1; i <= d; i++) {
    ct += (dT.get(ymd(y, m, i)) || { exp: 0 }).exp; cur.push(ct);
    if (i <= nP) { cp += (dP.get(ymd(py, pm, i)) || { exp: 0 }).exp; prev.push(cp); } else prev.push(null);
  }
  const prevSame = prev[Math.min(d, nP) - 1] || 0, isCur = ymOf(R) === ymOf(t), full = d === dim(y, m);
  el.innerHTML = `<div class="card-head"><div><h3 class="card-title">${icon("trend")}${isCur ? "이번 달" : `${m}월`} 소비 추이</h3><p class="card-sub">${m}월 1일 ~ ${d}일 · 누적 지출</p></div>
    <div class="card-tools">${tblBtn("cum")}<button class="link-btn" data-act="cumDetail" data-v="${ymd(y, m, 1)}">상세 ${icon("chevR", 14)}</button></div></div>
    <div class="fig-row"><div class="fig">${fmt(ct)}<span class="unit">원</span></div><span class="fig-l">누적 지출</span>
      <span class="fig-d">${prevSame || ct ? deltaHTML(ct, prevSame, { prevName: "지난달 기록" }) : ""}${prevSame ? `<span class="muted">${pm}월 ${full ? "한 달" : `같은 기간(1~${Math.min(d, nP)}일)`} 대비</span>` : ""}</span></div>
    <div class="legend big-legend"><span><i style="background:var(--exp)"></i>${isCur ? "이번 달" : `${m}월`}</span><span><i class="dash" style="border-top-color:var(--prev-series)"></i>${isCur ? "지난달" : `${pm}월`}</span></div>
    <div class="chart" id="cumChart"></div>
    <p class="foot-note">두 달의 1~${d}일 누적 지출을 비교해요 · ${pm}월 전체 지출 ${won(pAll)}</p>`;
  const host = $("#cumChart");
  if (UI.tables.cum) { host.innerHTML = tableHTML(["일", `${m}월 누적`, `${pm}월 누적`], cur.map((v, i) => [`${i + 1}일`, won(v), prev[i] == null ? "-" : won(prev[i])])); return; }
  if (!ct && !prevSame) { host.innerHTML = `<div class="empty">아직 비교할 지출 기록이 없어요</div>`; return; }
  const N = cur.length, everyL = N <= 12 ? 1 : Math.ceil(N / 6), labelIdx = [];
  const H = clamp(host.clientHeight || 0, 240, 440);
  for (let i = N - 1; i >= 0; i -= everyL) labelIdx.push(i);
  lineChart(host, {
    labels: cur.map((_, i) => `${i + 1}일`), height: H, inset: N <= 12 ? 26 : 8, labelFmt: labelWon,
    series: [
      { name: isCur ? "지난달" : `${pm}월`, color: "var(--prev-series)", values: prev, dash: true, dots: N <= 16 },
      { name: isCur ? "이번 달" : `${m}월`, color: "var(--exp)", values: cur, area: true, dots: N <= 16, pointLabels: true, labelIdx },
    ],
    tipTitle: (i) => `${i + 1}일까지 누적`, aria: `${m}월과 ${pm}월 누적 지출 비교`,
    tipFoot: (i) => (prev[i] != null ? `<div class="tt-s">차이 ${sgnWon(cur[i] - prev[i])}</div>` : ""),
  });
}

/* ---------- 카테고리별 지출 (도넛 + TOP 5) ---------- */

/* ---------- 지출의 흐름 (지출·수입을 위아래로) ---------- */
function flowItems() {
  const { from, to } = periodRange(), t = todayStr(), exp = [], inc = [];
  const tipOf = (title, g) => `<div class="tt-t">${esc(title)}</div>${ttRow(won(g.exp), "지출", "var(--exp)")}${ttRow(won(g.inc), "수입", "var(--inc)")}`;
  const push = (p) => { exp.push({ ...p, value: p.g.exp, cls: "f-exp" }); inc.push({ ...p, value: p.g.inc, cls: "f-inc" }); };
  if (UI.period === "year") {
    const [y] = splitD(from);
    for (let m = 1; m <= 12; m++) { const g = agg(ymd(y, m, 1), ymd(y, m, dim(y, m))); push({ g, label: `${m}월`, hi: ymOf(t) === `${y}-${pad(m)}`, tip: tipOf(`${y}년 ${m}월`, g), key: ymd(y, m, 1), kind: "month" }); }

/* ============================================================

   종목마다 반영 합계는 한 줄로 보여 줘요 (예: A공모주 +28,500원)

function ipoStats() {

    yrProf: yr.reduce((s, p) => s + ipoProfit(p), 0), yrN: yr.length,
    pendSum: pend.reduce((s, p) => s + ipoCost(p), 0), pendSub: pend.filter((p) => !ipoRefunded(p)).length, pendHold: pend.filter(ipoRefunded).length,

}

/** 손익 계산식 · 자산 반영 미리보기 (입금 반영은 금액을 적어야 고를 수 있어요) */

function ipoSubmit(ev) {

  if (v.ra != null && v.ra > v.sa) { $("#ipRa").focus(); toast("환불 금액이 청약 입금액보다 커요", { err: true }); return; }

let MODAL = null;
function openModal({ title, sub, body, foot, wide, onMount, onClose, tabs }) {
  closeModal(); closeMenu();
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal${wide ? " wide" : ""}" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="modal-head"><div><h2 class="modal-title" id="mTitle">${esc(title)}</h2>${sub ? `<div class="modal-sub">${sub}</div>` : ""}</div><button type="button" class="icon-btn" data-close aria-label="닫기">${icon("x")}</button></div>${tabs || ""}<div class="modal-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ""}</div>`;
  $("#modalRoot").appendChild(bg);
  const el = bg.firstChild, prevFocus = document.activeElement;
  const M = { el, bg, onClose, close: () => { if (MODAL === M) MODAL = null; bg.remove(); M.onClose && M.onClose(); prevFocus && prevFocus.focus && prevFocus.focus({ preventScroll: true }); } };
  let downOnBg = false;
  bg.addEventListener("pointerdown", (e) => { downOnBg = e.target === bg; });
  bg.addEventListener("click", (e) => { if ((e.target === bg && downOnBg) || e.target.closest("[data-close]")) M.close(); });
  MODAL = M;
  onMount && onMount(el, M);
  const f = el.querySelector("[autofocus]") || el.querySelector(".modal-body input:not([type=hidden]), .modal-body select, .modal-body button");
  // 이미 창 안에서 입력을 시작했으면 포커스를 옮기지 않아요
  setTimeout(() => { if (f && !el.contains(document.activeElement)) f.focus({ preventScroll: true }); }, 30);
  return M;
}
function closeModal() { if (MODAL) MODAL.close(); }
function setModalBody(html) { if (MODAL) { MODAL.el.querySelector(".modal-body").innerHTML = html; hydrateIcons(MODAL.el); } }
function confirmBox(title, msg, ok = "확인", danger = false) {
  return new Promise((res) => {
    let done = false;
    openModal({
      title, body: `<p class="note">${msg}</p>`,
      foot: `<span class="sp"></span><button class="btn btn-ghost" data-close>취소</button><button class="btn ${danger ? "btn-danger" : "btn-primary"}" id="cfOk">${esc(ok)}</button>`,
      onMount: (el, M) => { el.querySelector("#cfOk").onclick = () => { done = true; M.close(); res(true); }; },
      onClose: () => { if (!done) res(false); },

}

      <div class="st left"><div class="st-l">${m}월 남은 고정지출</div><div class="st-v">${won(st.left)}</div></div>
    </div>
    ${cur && st.items.length ? `<div class="note" style="margin-bottom:6px">지금까지 ${m}월 지출 <b>${won(a.exp)}</b> + 아직 안 나간 고정지출 <b>${won(upLeft)}</b> = 월말 예상 최소 <b>${won(a.exp + upLeft)}</b></div>` : ""}
    <div class="sec-t"><span>${m}월 결제 목록 <span class="muted" style="font-weight:700">${st.items.length}개</span></span>${dueList.length ? `<button class="btn btn-sm btn-accent" data-fx="recAll">${icon("check", 15)}결제일 지난 ${dueList.length}건 기록</button>` : ""}</div>
    <div class="fx-list">${st.items.length ? st.items.map((s) => { const c = cat(s.f.c); return `<div class="fx-row"><div class="fx-day"><b>${splitD(s.due)[2]}</b>일</div><span class="emo">${esc(c.emoji)}</span>
      <div style="min-width:0"><div class="ent-memo">${esc(s.f.name)}</div><div class="ent-meta">${esc(c.name)} · ${won(s.f.a)}</div></div>
      <span class="st-badge ${s.state === "done" ? "done" : s.state === "due" ? "due" : "up"}">${s.state === "done" ? "기록됨" : s.state === "due" ? "미기록" : diffDays(t, s.due) === 0 ? "오늘" : `D-${diffDays(t, s.due)}`}</span>
      <div class="fx-acts" style="display:flex;gap:2px">${s.state !== "done" ? `<button class="btn btn-sm" data-fx="rec" data-id="${esc(s.f.id)}">기록</button>` : ""}<button class="icon-btn sm" data-fx="edit" data-id="${esc(s.f.id)}" aria-label="수정">${icon("pencil", 15)}</button><button class="icon-btn sm" data-fx="del" data-id="${esc(s.f.id)}" aria-label="삭제">${icon("trash", 15)}</button></div></div>`; }).join("")
      : `<div class="empty" style="min-height:90px">${all.length ? "이 달에 해당하는 고정지출이 없어요" : "아직 등록한 고정지출이 없어요. 아래에서 추가해 보세요"}</div>`}</div>
    ${all.filter((f) => !st.items.some((s) => s.f.id === f.id)).length ? `<div class="sec-t"><span class="muted">이 달에는 쉬는 항목</span></div><div class="fx-list">${all.filter((f) => !st.items.some((s) => s.f.id === f.id)).map((f) => `<div class="fx-row"><div class="fx-day"><b>${f.day}</b>일</div><span class="emo">${esc(cat(f.c).emoji)}</span><div style="min-width:0"><div class="ent-memo">${esc(f.name)}</div><div class="ent-meta">${f.on === false ? "일시정지" : `${esc(f.from || "")}부터`} · ${won(f.a)}</div></div><span class="st-badge off">${f.on === false ? "정지" : "시작 전"}</span><div class="fx-acts" style="display:flex;gap:2px"><button class="icon-btn sm" data-fx="edit" data-id="${esc(f.id)}" aria-label="수정">${icon("pencil", 15)}</button><button class="icon-btn sm" data-fx="del" data-id="${esc(f.id)}" aria-label="삭제">${icon("trash", 15)}</button></div></div>`).join("")}</div>` : ""}
    <div class="sec-t"><span>${ed ? `${icon("pencil", 16)}고정지출 수정` : `${icon("plus", 16)}새 고정지출 등록`}</span></div>
    <form class="form-grid" id="fxForm" autocomplete="off" style="padding:14px;border-radius:18px;background:var(--tint)">
      <label class="lbl">매달 결제일<select class="input" id="fxDay">${Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}"${(ed ? ed.day : Math.min(28, splitD(t)[2])) === i + 1 ? " selected" : ""}>${i + 1}일${i + 1 >= 29 ? " (말일 맞춤)" : ""}</option>`).join("")}</select></label>
      <label class="lbl">금액 (원)<input class="input" id="fxAmt" inputmode="numeric" placeholder="예: 13,500" value="${ed ? fmt(ed.a) : ""}"/></label>
      <label class="lbl">이름<input class="input" id="fxName" maxlength="40" placeholder="예: 넷플릭스, 통신비, 적금" value="${ed ? esc(ed.name) : ""}"/></label>
      <label class="lbl">분야<select class="input" id="fxCat">${catOptions(ed ? ed.c : 16)}</select></label>
      <label class="lbl">시작 월<input class="input" type="month" id="fxFrom" value="${ed ? esc(ed.from || ymOf(t)) : `${y}-${pad(m)}`}"/></label>
      <label class="check" style="align-self:end;margin:0 0 10px"><input type="checkbox" id="fxOn"${!ed || ed.on !== false ? " checked" : ""}/><span>매달 반복 중</span></label>
      <div class="full" style="display:flex;gap:8px;justify-content:flex-end">${ed ? `<button type="button" class="btn btn-ghost" data-fx="cancel">취소</button>` : ""}<button type="submit" class="btn btn-primary">${ed ? "수정 완료" : "고정지출 등록"}</button></div>
    </form>`);
  const el = MODAL.el;
  const amt = el.querySelector("#fxAmt");
  amt.addEventListener("input", () => { const n = Number(amt.value.replace(/[^\d]/g, "")); amt.value = n ? n.toLocaleString("ko-KR") : ""; });
  const nameIn = el.querySelector("#fxName");
  nameIn.addEventListener("input", () => { if (FX_EDIT) return; const g = guessCat(nameIn.value); if (g != null) el.querySelector("#fxCat").value = g; });
  el.querySelector("#fxAuto").addEventListener("change", (e) => { DB.settings.autoFixed = e.target.checked; DB.settings.t = Date.now(); commit({ noRender: true }); if (e.target.checked) autoRecordFixed(); renderAll(); drawFixed(); });
  el.querySelector("#fxForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const a = Number(amt.value.replace(/[^\d]/g, "")), name = nameIn.value.trim();
    if (!a || !name) { toast(!name ? "이름을 입력해 주세요" : "금액을 입력해 주세요"); return; }
    const rec = { name, a, c: Number(el.querySelector("#fxCat").value), day: Number(el.querySelector("#fxDay").value), from: el.querySelector("#fxFrom").value || ymOf(t), on: el.querySelector("#fxOn").checked, t: Date.now() };
    if (ed) Object.assign(ed, rec); else DB.fixed.push({ id: "fx" + uid(), del: 0, ...rec });
    toast(ed ? "고정지출을 수정했어요" : `‘${name}’ 고정지출을 등록했어요`);
    FX_EDIT = null; commit(); drawFixed();
  });
  el.querySelector(".modal-body").onclick = async (e) => {
    const b = e.target.closest("[data-fx]"); if (!b) return;
    const act = b.dataset.fx, id = b.dataset.id, f = id && DB.fixed.find((x) => x.id === id);
    if (act === "prev" || act === "next") { let [yy, mm] = FX_YM; mm += act === "next" ? 1 : -1; if (mm < 1) { mm = 12; yy--; } if (mm > 12) { mm = 1; yy++; } FX_YM = [yy, mm]; drawFixed(); }
    else if (act === "recAll") { const n = recordFixed(dueList); toast(`고정지출 ${n}건을 ${m}월 내역에 기록했어요`); drawFixed(); }
    else if (act === "rec") { const s = st.items.find((x) => x.f.id === id); if (s) { recordFixed([s]); toast(`‘${s.f.name}’ ${won(s.f.a)}을 ${splitD(s.due)[1]}월 ${splitD(s.due)[2]}일로 기록했어요`); drawFixed(); } }
    else if (act === "edit") { FX_EDIT = id; drawFixed(); MODAL.el.querySelector("#fxForm").scrollIntoView({ behavior: "smooth", block: "center" }); }
    else if (act === "cancel") { FX_EDIT = null; drawFixed(); }
    else if (act === "del" && f) {
      f.del = 1; f.t = Date.now(); commit(); drawFixed();
      toast(`‘${f.name}’ 고정지출을 지웠어요 (이미 기록된 내역은 남아요)`, { action: "되돌리기", onAction: () => { f.del = 0; f.t = Date.now(); commit(); if (MODAL) drawFixed(); } });
    }
  };
}

/* ---------- 내역 수정 ---------- */
function openEdit(id) {
  const e = findEntry(id); if (!e) return;
  let mode = e.a < 0 ? "inc" : "exp";
  openModal({
    title: "내역 수정", sub: esc(dayLabel(e.d, true)),
    body: `<form class="form-grid" id="edForm" autocomplete="off">
      <div class="full" style="display:flex;justify-content:space-between;align-items:center"><div class="seg sm" id="edMode"><button type="button" data-v="exp">지출</button><button type="button" data-v="inc">수입</button></div><span class="muted" style="font-size:13px;font-weight:700">${e.src === "xlsx" ? "엑셀에서 불러온 내역" : e.src === "fixed" ? "고정지출로 기록한 내역" : "직접 입력한 내역"}</span></div>
      <label class="lbl">금액 (원)<input class="input" id="edAmt" inputmode="numeric" value="${fmt(Math.abs(e.a))}"/></label>
      <label class="lbl">날짜<input class="input" type="date" id="edDate" value="${e.d}"/></label>
      <label class="lbl full">내역<input class="input" id="edMemo" maxlength="60" value="${esc(e.m)}"/></label>
      <label class="lbl full">분야<select class="input" id="edCat">${catOptions(e.c)}</select></label>
      <label class="check full" style="margin:0"><input type="checkbox" id="edU"${e.u ? " checked" : ""}/><span>불필요한 지출이었어요</span></label></form>`,
    foot: `<button class="btn btn-danger" id="edDel">${icon("trash", 16)}삭제</button><span class="sp"></span><button class="btn btn-ghost" data-close>취소</button><button class="btn btn-primary" id="edSave">저장</button>`,
    onMount: (el, M) => {
      const paint = () => $$("#edMode button", el).forEach((b) => b.classList.toggle("is-on", b.dataset.v === mode));
      paint();
      el.querySelector("#edMode").onclick = (ev) => { const b = ev.target.closest("button"); if (b) { mode = b.dataset.v; paint(); } };
      const amt = el.querySelector("#edAmt");
      amt.addEventListener("input", () => { if (/^\s*[-−]/.test(amt.value)) { mode = "inc"; paint(); } const n = Number(amt.value.replace(/[^\d]/g, "")); amt.value = n ? n.toLocaleString("ko-KR") : ""; });
      const save = () => {
        const a = Number(amt.value.replace(/[^\d]/g, "")), d = el.querySelector("#edDate").value;
        if (!a) { toast("금액을 입력해 주세요"); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { toast("날짜를 확인해 주세요"); return; }
        Object.assign(e, { a: mode === "inc" ? -a : a, d, m: el.querySelector("#edMemo").value.trim(), c: Number(el.querySelector("#edCat").value), u: el.querySelector("#edU").checked && mode === "exp" ? 1 : 0, t: Date.now() });
        M.close(); commit(); toast("내역을 수정했어요");
      };
      el.querySelector("#edSave").onclick = save;
      el.querySelector("#edForm").addEventListener("submit", (ev) => { ev.preventDefault(); save(); });
      el.querySelector("#edDel").onclick = () => { M.close(); deleteEntry(e.id); };
    },
  });
}

/* ---------- 설정 (자산 · 분야 · 데이터) ---------- */
let SET_TAB = "asset", CAT_DRAFT = null;
function openSettings(tab) {
  SET_TAB = tab || SET_TAB || "asset"; CAT_DRAFT = DB.cats.map((c) => ({ ...c }));
  openModal({
    title: "설정", wide: true, body: "",
    tabs: `<div class="tabs seg" id="setTabs"><button data-t="asset">자산</button><button data-t="cats">분야(카테고리)</button><button data-t="data">데이터</button></div>`,
    onMount: (el) => { el.querySelector("#setTabs").onclick = (e) => { const b = e.target.closest("button"); if (b) { SET_TAB = b.dataset.t; drawSettings(); } }; drawSettings(); },
  });
}
function drawSettings() {
  if (!MODAL) return;
  $$("#setTabs button", MODAL.el).forEach((b) => b.classList.toggle("is-on", b.dataset.t === SET_TAB));
  const s = DB.settings, t = todayStr();
  if (SET_TAB === "asset") {
    const bal = DB.importInfo && DB.importInfo.balance;
    setModalBody(`<p class="note">현재 자산 = <b>기초자산</b> + 기준일 이후 <b>수입</b> − <b>지출</b> (적금·주식 이동 포함)<br/>기초자산은 기준일 당시 통장·현금 등을 모두 합친 금액이에요.</p>
      <div class="form-grid" style="margin-top:12px">
        <label class="lbl">기초자산 (원)<input class="input" id="sBase" inputmode="numeric" value="${s.base < 0 ? "-" : ""}${fmt(Math.abs(s.base))}"/></label>
        <label class="lbl">기준일<input class="input" type="date" id="sBaseDate" value="${s.baseDate}"/></label>
      </div>
      <div class="note" style="margin-top:12px" id="sPreview"></div>
      ${bal ? `<div class="note warn" style="margin-top:10px">엑셀 <b>${bal.month}월 시트의 ‘현재금액’ ${won(bal.value)}</b>에 맞추려면 기초자산을 <b>${won(bal.base)}</b>(기준일 ${esc(bal.baseDate.replaceAll("-", "."))})으로 두면 돼요. <button class="btn btn-sm" id="sMatch" style="margin-left:6px">엑셀에 맞추기</button></div>` : ""}
      <div class="sec-t">통계 옵션</div>
      <label class="radio-card"><input type="checkbox" id="sInv"${s.includeInvest ? " checked" : ""}/><span>적금·주식(재테크) 내역도 지출/수입 통계에 포함<small>끄면 저축·투자로 옮긴 돈은 소비가 아니므로 지출에서 빼고 보여 줘요. 현재 자산 계산에는 항상 포함돼요.</small></span></label>`);
    const el = MODAL.el, base = el.querySelector("#sBase"), bd = el.querySelector("#sBaseDate");
    const preview = () => {
      const neg = /^\s*[-−]/.test(base.value), v = (neg ? -1 : 1) * (Number(base.value.replace(/[^\d]/g, "")) || 0);
      let a = v; for (const e of idx().live) { if (e.d > t) break; if (e.d >= (bd.value || s.baseDate)) a -= e.a; }
      el.querySelector("#sPreview").innerHTML = `이 설정이면 오늘 현재 자산은 <b>${won(a)}</b>이에요.`;
      return v;
    };
    base.addEventListener("input", () => { const neg = /^\s*[-−]/.test(base.value), n = Number(base.value.replace(/[^\d]/g, "")); base.value = (neg ? "-" : "") + (n ? n.toLocaleString("ko-KR") : ""); preview(); });
    bd.addEventListener("change", preview); preview();
    const apply = () => { const v = preview(); if (v !== s.base || bd.value !== s.baseDate) { s.base = v; s.baseDate = bd.value || s.baseDate; s.t = Date.now(); commit(); toast("기초자산을 저장했어요"); } };
    base.addEventListener("change", apply); bd.addEventListener("change", apply);
    const mt = el.querySelector("#sMatch"); if (mt) mt.onclick = () => { s.base = bal.base; s.baseDate = bal.baseDate; s.t = Date.now(); commit(); drawSettings(); toast("엑셀 ‘현재금액’에 맞췄어요"); };
    el.querySelector("#sInv").addEventListener("change", (e) => { s.includeInvest = e.target.checked; s.t = Date.now(); commit(); });
  } else if (SET_TAB === "cats") {
    const counts = new Map(); for (const e of idx().live) counts.set(e.c, (counts.get(e.c) || 0) + 1);
    setModalBody(`<p class="note">번호는 엑셀의 <b>카테고리 번호</b>와 같아요. 엑셀을 불러올 때 이 번호로 분야를 맞춰요. 이모지·이름·종류를 자유롭게 바꿀 수 있어요.</p>
      <div style="margin-top:10px">${CAT_DRAFT.map((c, i) => `<div class="cat-edit" data-i="${i}"><span class="no">${c.id}</span><input class="input emo-in" data-k="emoji" value="${esc(c.emoji)}" maxlength="4" aria-label="이모지"/><input class="input" data-k="name" value="${esc(c.name)}" maxlength="12" aria-label="이름"/><select class="input type-sel" data-k="type" aria-label="종류">${Object.entries(TYPE_LABEL).map(([k, v]) => `<option value="${k}"${c.type === k ? " selected" : ""}>${v}</option>`).join("")}</select><span class="cnt">${counts.get(c.id) || 0}건</span><button class="icon-btn sm" data-del="${i}" aria-label="삭제">${icon("trash", 15)}</button></div>`).join("")}</div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-sm" id="cAdd">${icon("plus", 15)}분야 추가</button><span style="flex:1"></span><button class="btn btn-sm btn-ghost" id="cReset">되돌리기</button><button class="btn btn-sm btn-primary" id="cSave">분야 저장</button></div>
      <p class="muted" style="font-size:13px;font-weight:700;margin-top:10px">종류: <b>지출</b> 소비 · <b>수입</b> 월급·용돈 · <b>재테크</b> 적금·주식처럼 돈을 옮기는 것</p>`);
    const el = MODAL.el;
    el.querySelector(".modal-body").oninput = (e) => { const row = e.target.closest(".cat-edit"); if (row && e.target.dataset.k) CAT_DRAFT[Number(row.dataset.i)][e.target.dataset.k] = e.target.value; };
    el.querySelector(".modal-body").onchange = (e) => { const row = e.target.closest(".cat-edit"); if (row && e.target.dataset.k) CAT_DRAFT[Number(row.dataset.i)][e.target.dataset.k] = e.target.value; };
    el.querySelector("#cAdd").onclick = () => { const id = Math.max(0, ...CAT_DRAFT.map((c) => c.id)) + 1; CAT_DRAFT.push({ id, name: "새 분야", emoji: "🏷️", type: "exp" }); drawSettings(); };
    el.querySelector("#cReset").onclick = () => { CAT_DRAFT = DB.cats.map((c) => ({ ...c })); drawSettings(); };
    el.querySelectorAll("[data-del]").forEach((b) => b.onclick = async () => {
      const c = CAT_DRAFT[Number(b.dataset.del)], n = counts.get(c.id) || 0;
      if (n) {
        const ok = await confirmBox("분야 삭제", `‘${esc(c.name)}’ 분야에 내역이 ${n}건 있어요. 삭제하면 이 내역들은 <b>기타</b> 분야로 옮겨져요.`, "옮기고 삭제", true);
        openSettings("cats"); if (!ok) return;
        const target = DB.cats.find((x) => x.name === "기타" && x.id !== c.id) || DB.cats.find((x) => x.id !== c.id);
        for (const e of DB.entries) if (e.c === c.id) { e.c = target.id; e.t = Date.now(); }
        CAT_DRAFT = CAT_DRAFT.filter((x) => x.id !== c.id); DB.cats = DB.cats.filter((x) => x.id !== c.id); DB.catsT = Date.now(); commit(); drawSettings(); return;
      }
      CAT_DRAFT.splice(Number(b.dataset.del), 1); drawSettings();
    });
    el.querySelector("#cSave").onclick = () => {
      const clean = CAT_DRAFT.map((c) => ({ id: c.id, name: String(c.name || "").trim() || `분야 ${c.id}`, emoji: String(c.emoji || "").trim() || "🏷️", type: TYPE_LABEL[c.type] ? c.type : "exp" }));
      DB.cats = clean; DB.catsT = Date.now(); commit(); toast("분야를 저장했어요"); drawSettings();
    };
  } else {
    const L = idx().live, real = L.filter((e) => e.src !== "sample");
    const size = new Blob([lsGet(LS.data) || ""]).size;
    const ii = DB.importInfo;
    setModalBody(`<div class="stat-tiles"><div class="st"><div class="st-l">저장된 내역</div><div class="st-v">${fmt(real.length)}건</div></div><div class="st"><div class="st-l">기록 기간</div><div class="st-v" style="font-size:15px">${real.length ? `${esc(real[0].d.replaceAll("-", "."))} ~<br/>${esc(real[real.length - 1].d.replaceAll("-", "."))}` : "-"}</div></div><div class="st"><div class="st-l">브라우저 저장 용량</div><div class="st-v">${(size / 1024).toFixed(0)}KB</div></div></div>
      ${ii ? `<p class="note">마지막 엑셀 불러오기: <b>${esc(ii.file)}</b> · ${esc(new Date(ii.at).toLocaleString("ko-KR"))} · ${fmt(ii.n)}건</p>` : ""}
      <div class="sec-t">엑셀 · 백업</div>

function parseWorkbook(XLSX, wb, fileName) {

    rows.forEach((row, r) => (row || []).forEach((v, c) => {
      const s = cellStr(v).replace(/\s/g, "");
      if (s === "카테고리" || s === "분류") {
        const right = cellStr(row[c + 1]).replace(/\s/g, "");
        if (/^(내역|이름|분야|항목|명칭)$/.test(right)) {

    }));

  const legendByName = new Map([...res.legend].map(([n, nm]) => [norm(nm), n]));

    let hr = -1, col = null;
    for (let r = 0; r < Math.min(rows.length, 15) && hr < 0; r++) {
      const row = rows[r] || [], found = {};
      row.forEach((v, c) => { const s = cellStr(v).replace(/\s/g, ""); if (!s) return; for (const k of Object.keys(H)) if (found[k] == null && H[k](s)) found[k] = c; });

    if (hr < 0) { if (rows.length) info.skip = true; res.sheets.push(info); return; }
    // 엑셀 요약 셀(누적금액 등) 읽기 → 검증용
    const labelVal = (re) => { for (const row of rows) { if (!row) continue; for (let c = 0; c < row.length; c++) { if (re.test(cellStr(row[c]).replace(/\s/g, ""))) { for (let k = c + 1; k < Math.min(row.length, c + 7); k++) { const a = parseAmount(row[k]); if (a != null) return a; } } } } return null; };
    const xExp = labelVal(/^누적금액$/), xInc = labelVal(/^누적금액\(\+\)$/), xNow = labelVal(/^현재금액$/);
    let month = info.month, last = null;
    const ctx = { year: res.year, month };
    const parsed = [];
    for (let r = hr + 1; r < rows.length; r++) {
      const row = rows[r]; if (!row) continue;
      const dv = row[col.date], av = row[col.amt], cv = col.cat != null ? row[col.cat] : null, mv = col.memo != null ? row[col.memo] : null;
      const ds = cellStr(dv), ms = cellStr(mv);
      if (row.slice(0, Math.max(col.amt, col.memo ?? 0) + 1).some((v) => /^(합계|총계|소계|누계|total)$/i.test(cellStr(v).replace(/\s/g, "")))) continue;

    res.balance = { month: bl.month, value: bl.value, base: bl.value + sumA, baseDate };
  }
  return res;
}

function applyImport(res, { mode, useBase, renames, creates }) {
  if (DB.sample) clearSample(true);
  // 분야: 이름 맞추기 · 새 분야 추가
  const guessType = (nm) => (/월급|급여|용돈|수입|알바|과외|인건비|상여|보너스/.test(nm) ? "inc" : /주식|적금|청약|저축|투자|예금|펀드|코인/.test(nm) ? "inv" : "exp");
  const guessEmoji = (nm) => { const g = guessCat(nm); return g != null && cat(g).emoji ? cat(g).emoji : "🏷️"; };
  let catsChanged = false;
  for (const r of renames) { const c = DB.cats.find((x) => x.id === r.app.id); if (c) { c.name = r.nm; catsChanged = true; } }
  const strMap = new Map();
  for (const r of creates) {
    let id = typeof r.id === "number" ? r.id : Math.max(20, ...DB.cats.map((c) => c.id)) + 1;
    if (DB.cats.some((c) => c.id === id)) id = Math.max(...DB.cats.map((c) => c.id)) + 1;
    DB.cats.push({ id, name: r.nm, emoji: guessEmoji(r.nm), type: guessType(r.nm) });
    if (typeof r.id === "string") strMap.set(r.id, id);
    catsChanged = true;
  }
  if (catsChanged) DB.cats.sort((a, b) => a.id - b.id), (DB.catsT = Date.now());
  for (const e of res.entries) if (typeof e.c === "string") e.c = strMap.get(e.c) || DB.cats.find((c) => norm(c.name) === norm(e.c.slice(1)))?.id || 11;
  const key = (e) => `${e.d}|${e.c}|${e.a}|${norm(e.m)}`;
  const now = Date.now(); let added = 0, kept = 0, removed = 0, dupe = 0;
  const live = DB.entries.filter((e) => !e.del);
  if (mode === "replace") {
    const incoming = new Map(res.entries.map((e) => [e.id, e]));
    for (const e of live) if (e.src === "xlsx") { if (incoming.has(e.id)) { incoming.delete(e.id); kept++; } else { e.del = 1; e.t = now; removed++; } }
    const appCount = new Map(); for (const e of live) if (e.src !== "xlsx") appCount.set(key(e), (appCount.get(key(e)) || 0) + 1);
    const byId = new Map(DB.entries.map((e) => [e.id, e]));
    for (const e of incoming.values()) {
      const k = key(e); if (appCount.get(k)) { appCount.set(k, appCount.get(k) - 1); dupe++; continue; }
      const old = byId.get(e.id); if (old) { Object.assign(old, e, { t: now, del: 0 }); } else DB.entries.push({ ...e, t: now });
      added++;

    const ids = new Set(live.map((e) => e.id));
    const byId = new Map(DB.entries.map((e) => [e.id, e]));
    for (const e of res.entries) {
      const k = key(e); if (cnt.get(k) || ids.has(e.id)) { if (cnt.get(k)) cnt.set(k, cnt.get(k) - 1); dupe++; continue; }
      const old = byId.get(e.id); if (old) Object.assign(old, e, { t: now, del: 0 }); else DB.entries.push({ ...e, t: now });
      added++;
    }
  }
  // 순서 값 보정: 엑셀 줄 순서를 유지하면서 앱 입력보다 앞에 오도록
  const byId2 = new Map(DB.entries.map((e) => [e.id, e]));
  res.entries.forEach((e, i) => { const x = byId2.get(e.id); if (x && x.src === "xlsx") x.o = 1e6 + i; });
  if (useBase && res.balance) { DB.settings.base = res.balance.base; DB.settings.baseDate = res.balance.baseDate; DB.settings.t = now; }
  else if (!DB.settings.t && res.entries.length) { DB.settings.baseDate = minD(DB.settings.baseDate, res.entries[0].d.slice(0, 8) + "01"); DB.settings.t = now; }
  DB.importInfo = { at: now, file: res.file, n: res.entries.length, balance: res.balance || null };

    const hasThisMonth = res.entries.some((e) => ymOf(e.d) === ymOf(t));
    if (!hasThisMonth && UI.period === "month") UI.anchor = lastD;
  }
  commit();
  return { added, kept, removed, dupe };
}

    if (!this.on()) return "연결 안 됨";
    if (this.state === "syncing") return "동기화 중…";
    if (this.state === "error") return `동기화 실패 · ${this.msg || "잠시 후 다시 시도해요"}`;
    const l = Number(lsGet(LS.last)); return l ? `✓ ${new Date(l).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" })} 동기화됨` : "연결됨";
  },
  async gh(path, opt = {}, tok = this.tok()) {
    const headers = { Accept: "application/vnd.github+json", Authorization: "Bearer " + tok };
    if (opt.body) headers["Content-Type"] = "application/json";
    try { return await fetch(GH_API + path, { cache: "no-store", ...opt, headers }); }
    catch (e) { throw new Error("인터넷 연결을 확인해 주세요"); }
  },
  async fail(r, what) {
    let m = ""; try { m = ((await r.json()) || {}).message || ""; } catch (e) { /* noop */ }
    if (r.status === 401) return new Error("토큰이 올바르지 않거나 만료됐어요");
    if (r.status === 403 && /rate limit/i.test(m)) return new Error("GitHub 요청이 많아요. 잠시 후 다시 시도해요");
    if (r.status === 403) return new Error("토큰 권한을 확인해 주세요 (Contents: Read and write)");
    if (r.status === 404) return new Error("저장소를 찾을 수 없어요. 저장소 이름과 토큰의 저장소 선택을 확인해 주세요");
    return new Error(`${what} 오류 ${r.status}${m ? " · " + m : ""}`);
  },
  async fetchRemote() {
    const path = `/repos/${this.repo()}/contents/${GH_FILE}`;
    const r = await this.gh(`${path}?t=${Date.now()}`);
    if (r.status === 404 || r.status === 409) { this.sha = null; return null; } // 아직 파일이 없어요
    if (!r.ok) throw await this.fail(r, "읽기");
    const j = await r.json();
    let b64 = j.content;
    if (j.encoding !== "base64" || !b64) { // 1MB가 넘으면 내용이 비어 와요 → blob으로 받기
      const b = await this.gh(`/repos/${this.repo()}/git/blobs/${j.sha}`);
      if (!b.ok) throw await this.fail(b, "읽기");
      b64 = (await b.json()).content;
    }
    const p = parseFile(textFromB64(b64));
    this.sha = j.sha; this.size = j.size || 0;
    return p;
  },
  async write(text) {
    const t = new Date(), dev = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? "모바일" : "컴퓨터";
    const body = { message: `가계부 동기화 · ${todayStr()} ${pad(t.getHours())}:${pad(t.getMinutes())} · ${dev}`, content: b64FromText(text) };
    if (this.sha) body.sha = this.sha;
    const r = await this.gh(`/repos/${this.repo()}/contents/${GH_FILE}`, { method: "PUT", body: JSON.stringify(body) });
    if (r.status === 409 || (r.status === 422 && !this.sha)) throw new GhConflict("conflict");
    if (!r.ok) throw await this.fail(r, "저장");
    const j = await r.json(); this.sha = (j.content && j.content.sha) || null; this.size = new TextEncoder().encode(text).length;
  },
  /** 받기 → 합치기 → (달라졌으면) 올리기. 충돌하면 다시 받아서 최대 4번까지 */
  async cycle() {
    for (let i = 0; ; i++) {
      const remote = await this.fetchRemote();
      const local = localPayload(), merged = adoptMerged(local, mergePayload(local, remote));
      const out = fileText(merged);
      if (remote && out === fileText(remote)) return false;
      try { await this.write(out); return true; } catch (e) {
        if (!(e instanceof GhConflict)) throw e;
        if (i >= 3) throw new Error(remote ? "다른 기기와 동시에 저장하고 있어요. 잠시 후 다시 시도해요" : "저장소에 파일을 만들지 못했어요. 저장소를 만들 때 README를 추가했는지 확인해 주세요");
      }
    }
  },
  async run() {
    if (!this.on()) return false;
    this.busy = true; this.set("syncing");
    const g = this.gen;
    try {
      await this.cycle();
      if (this.gen === g) lsDel(LS.dirty);
      lsSet(LS.last, String(Date.now())); this.retry = 0; this.lastPull = Date.now(); this.set("idle");
      return true;
    } catch (e) {
      this.retry++; this.set("error", e.message);
      if (lsGet(LS.dirty) === "1" && this.retry <= 3) { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), Math.min(30000, 3000 * 2 ** this.retry)); }
      return false;
    } finally { this.busy = false; }
  },
  schedule() { if (!this.on()) return; this.gen++; lsSet(LS.dirty, "1"); clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 3000); },
  async push() {
    if (!this.on()) return false;
    if (this.busy) { clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); return false; }
    return this.run();
  },
  async pull(force) {
    if (!this.on() || this.busy) return false;
    if (!force && Date.now() - this.lastPull < 45000) return false;
    return this.run();
  },
  async connect(repoIn, tokIn) {
    const tok = String(tokIn || "").trim(); let repo = parseRepo(repoIn);
    if (!repo) throw new Error("저장소 이름을 입력해 주세요");
    if (!tok) throw new Error("토큰을 입력해 주세요");
    if (!repo.includes("/")) { // 이름만 적었으면 토큰 주인의 아이디를 붙여요
      const u = await this.gh("/user", {}, tok);
      if (!u.ok) throw await this.fail(u, "확인");
      repo = (await u.json()).login + "/" + repo;
    }
    const r = await this.gh(`/repos/${repo}`, {}, tok);
    if (!r.ok) throw await this.fail(r, "확인");
    const info = await r.json();
    if (!info.private) throw new Error("공개(Public) 저장소예요. 내역이 모두에게 보일 수 있어서 연결하지 않았어요. 비공개(Private) 저장소를 써 주세요");
    if (this.busy) throw new Error("동기화 중이에요. 잠시 후 다시 눌러 주세요");
    this.busy = true; clearTimeout(this.timer);
    lsSet(LS.ghTok, tok); lsSet(LS.ghRepo, info.full_name || repo); this.sha = null; this.retry = 0; this.set("syncing");
    let legacy = null;
    try {
      legacy = await importLegacyJsonbin();
      await this.cycle();
    } catch (e) {
      lsDel(LS.ghTok); lsDel(LS.ghRepo); this.set("off"); throw e;
    } finally { this.busy = false; }
    if (legacy && legacy.ok) { lsDel(LS.key); lsDel(LS.bin); }
    lsDel(LS.dirty); lsSet(LS.last, String(Date.now())); this.lastPull = Date.now(); this.set("idle");
    return { repo: this.repo(), legacy };
  },
  disconnect(silent) { lsDel(LS.ghTok); lsDel(LS.ghRepo); lsDel(LS.dirty); lsDel(LS.last); clearTimeout(this.timer); this.sha = null; this.set("off"); if (!silent) toast("이 기기의 GitHub 연결을 해제했어요"); },
  link() { const t = this.tok(), r = this.repo(); return t && r ? location.origin + location.pathname + "#gh=" + encodeURIComponent(btoa(JSON.stringify({ r, t }))) : ""; },
};

/* ---------- 예전 JSONBin 내역 한 번 가져오기 (읽기만, 그 뒤로는 쓰지 않아요) ---------- */
const hasLegacyJsonbin = () => !!(lsGet(LS.key) && lsGet(LS.bin));
async function decodeLegacy(rec) {
  if (!rec || rec.app !== "moneyboard") return null;
  let body;
  if (rec.enc === "gz") {
    if (typeof DecompressionStream === "undefined") return null;
    const ds = new Blob([bytesFromB64(rec.z)]).stream().pipeThrough(new DecompressionStream("gzip"));
    body = JSON.parse(await new Response(ds).text());
  } else body = rec.p;
  if (!body) return null;
  return { entries: (body.entries || []).map(unpackE), fixed: body.fixed || [], ipos: body.ipos || [], cats: body.cats || [], catsT: body.catsT || 0, settings: body.settings || null, importInfo: body.importInfo || null };
}
async function importLegacyJsonbin() {
  if (!hasLegacyJsonbin()) return null;
  try {
    const r = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(lsGet(LS.bin))}/latest`, { headers: { "X-Master-Key": lsGet(LS.key) }, cache: "no-store" });
    if (!r.ok) return { ok: false };
    const j = await r.json(), remote = await decodeLegacy(j && j.record !== undefined ? j.record : j);
    if (!remote) return { ok: false };
    const local = localPayload(); adoptMerged(local, mergePayload(local, remote));
    return { ok: true, n: remote.entries.filter((e) => !e.del).length };
  } catch (e) { return { ok: false }; }
}

/** 동기화 링크로 열었을 때: 저장 후 주소창에서 지우기. true = 연결 정보 받음, "old" = 예전 JSONBin 링크 */
function consumeSyncHash() {
  try {
    const h = location.hash;
    if (!h.startsWith("#gh=") && !h.startsWith("#sync=")) return false;
    history.replaceState(null, "", location.pathname + location.search);
    if (h.startsWith("#sync=")) return "old";
    const o = JSON.parse(atob(decodeURIComponent(h.slice(4))));
    if (!o || !o.r || !o.t) return false;
    lsSet(LS.ghRepo, String(o.r)); lsSet(LS.ghTok, String(o.t));
    return true;
  } catch (e) { return false; }
}

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { if (MENU) { closeMenu(); return; } if (MODAL) { closeModal(); return; } if (document.body.classList.contains("sheet-open")) { closeSheet(); return; } }
    const tag = (ev.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "textarea" || tag === "select" || ev.target.isContentEditable;
    if (typing || MODAL || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (ev.key === "n" || ev.key === "N" || ev.key === "+") { ev.preventDefault(); openSheet(); }
    else if (ev.key === "[" || ev.key === "ArrowLeft" && ev.shiftKey) { shiftAnchor(-1); renderAll(); }
    else if (ev.key === "]" || ev.key === "ArrowRight" && ev.shiftKey) { shiftAnchor(1); renderAll(); }
    else if (ev.key === "t" || ev.key === "T") { UI.anchor = todayStr(); UI.selDay = null; renderAll(); }
  });
  // 파일 끌어다 놓기
  document.addEventListener("dragover", (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) e.preventDefault(); });
  document.addEventListener("drop", (e) => {
    const f = e.dataTransfer && e.dataTransfer.files[0]; if (!f) return; e.preventDefault();
    if (/\.json$/i.test(f.name)) importJson(f); else if (/\.(xlsx|xlsm|xls|csv)$/i.test(f.name)) handleXlsxFile(f);
  });
  window.addEventListener("scroll", () => { TT.hide(); }, { passive: true });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkDayChange(); Sync.pull(); } });
  window.addEventListener("online", () => { if (lsGet(LS.dirty) === "1") Sync.push(); });
  window.addEventListener("storage", (e) => { if (e.key === LS.data && e.newValue) { try { Object.keys(DB).forEach((k) => delete DB[k]); Object.assign(DB, { entries: [], fixed: [], cats: [], catsT: 0, settings: {}, sample: false, importInfo: null }, JSON.parse(e.newValue)); normalizeDB(); invalidate(); KW = null; renderAll(); } catch (err) { /* noop */ } } });
}
let LAST_DAY = todayStr();
function checkDayChange() {
  const t = todayStr(); if (t === LAST_DAY) return;
  const wasToday = UI.anchor === LAST_DAY; LAST_DAY = t;
  if (wasToday) UI.anchor = t;
  if (!$("#fDate").value || $("#fDate").value < t) $("#fDate").value = t;
  autoRecordFixed(); renderAll();
}

function boot() {
  const fromLink = consumeSyncHash();
  loadDB();
  hydrateIcons();
  placeModules();
  syncDark();
  $("#fDate").value = todayStr();
  setMode("exp");
  bind();
  renderAll();
  Sync.set(Sync.on() ? "idle" : "off");
  if (fromLink === "old") toast("예전(JSONBin) 동기화 링크예요. 새 GitHub 동기화 링크로 열어 주세요", { err: true });
  if (Sync.on()) Sync.pull(true).then((ok) => { if (fromLink === true) toast(ok ? "동기화 링크로 연결했어요 ☁️" : "동기화 링크로 연결하지 못했어요 · " + (Sync.msg || "토큰을 확인해 주세요"), { err: !ok }); autoRecordFixed(); });
  else autoRecordFixed();
  setInterval(checkDayChange, 60000);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();

})();
</script>
</body>
